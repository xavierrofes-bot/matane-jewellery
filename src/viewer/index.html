<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ume Musubi — 3D Viewer · Matane Jewellery</title>
<link rel="stylesheet" href="../assets/fonts.css">
<style>
  :root{
    --ink:#1d1c1a; --muted:#8a8680; --line:#e7e4df; --bg:#ffffff; --accent:#1d1c1a;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"Zen Kaku Gothic New",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  #stage{position:fixed;inset:0}
  canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
  canvas:active{cursor:grabbing}
  header{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;padding:22px 28px;pointer-events:none}
  .brand{pointer-events:auto}
  .brand small{display:block;font-size:10.5px;letter-spacing:.28em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
  .brand h1{margin:0;font-family:"Shippori Mincho",serif;font-weight:500;font-size:30px;letter-spacing:.02em;line-height:1}
  .brand p{margin:6px 0 0;font-size:13px;color:var(--muted)}
  .pieces{display:flex;gap:4px;pointer-events:auto;border:1px solid var(--line);border-radius:999px;padding:4px;background:rgba(255,255,255,.85);backdrop-filter:blur(6px)}
  .pieces button{all:unset;cursor:pointer;font-size:12.5px;letter-spacing:.06em;padding:8px 16px;border-radius:999px;color:var(--muted);transition:.2s}
  .pieces button[aria-pressed="true"]{background:var(--ink);color:#fff}
  .pieces button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
  footer{position:fixed;left:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:center;gap:14px;padding:0 20px 26px;pointer-events:none}
  .metals{display:flex;gap:22px;pointer-events:auto}
  .metal{all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:8px;font-size:11.5px;letter-spacing:.05em;color:var(--muted);transition:color .2s}
  .metal .sw{width:34px;height:34px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08);outline:1px solid transparent;outline-offset:4px;transition:outline-color .2s,transform .2s}
  .metal:hover .sw{transform:scale(1.06)}
  .metal[aria-pressed="true"]{color:var(--ink)}
  .metal[aria-pressed="true"] .sw{outline-color:var(--ink)}
  .metal:focus-visible .sw{outline:2px solid var(--ink)}
  .sw.wg{background:radial-gradient(circle at 32% 28%,#fff 0,#e9ebee 30%,#b9bdc3 70%,#8e939a 100%)}
  .sw.yg{background:radial-gradient(circle at 32% 28%,#fff6dc 0,#efd08e 30%,#d2a654 70%,#a67a2e 100%)}
  .sw.pt{background:radial-gradient(circle at 32% 28%,#fbfaf7 0,#dedbd5 30%,#aeaaa3 70%,#86827b 100%)}
  .hint{font-size:11px;letter-spacing:.08em;color:#b2aea7;display:flex;gap:16px;align-items:center;pointer-events:auto}
  .hint button{all:unset;cursor:pointer;color:var(--muted);text-decoration:underline;text-underline-offset:3px}
  .hint button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
  #loader{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;background:var(--bg);transition:opacity .5s;z-index:5}
  #loader.hide{opacity:0;pointer-events:none}
  #loader .bar{width:160px;height:1px;background:var(--line);overflow:hidden}
  #loader .bar i{display:block;height:100%;width:0;background:var(--ink);transition:width .2s}
  #loader span{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}
  #err{display:none;position:fixed;inset:0;align-items:center;justify-content:center;text-align:center;padding:30px;font-size:14px;color:var(--muted);background:var(--bg);z-index:6}
  @media (max-width:600px){
    header{padding:16px 16px;flex-direction:column;gap:14px}
    .brand h1{font-size:25px}
    .metals{gap:16px}
    footer{padding-bottom:20px}
  }
</style>
</head>
<body>
<div id="stage"></div>

<header>
  <div class="brand">
    <small>Matane Jewellery</small>
    <h1 id="title">Ume Musubi Ring</h1>
    <p id="subtitle">14K White Gold</p>
  </div>
  <div class="pieces" role="group" aria-label="Piece">
    <button data-piece="ring" aria-pressed="true">Ring</button>
    <button data-piece="pendant" aria-pressed="false">Pendant</button>
  </div>
</header>

<footer>
  <div class="metals" role="group" aria-label="Metal">
    <button class="metal" data-metal="wg" aria-pressed="true"><span class="sw wg"></span>White Gold</button>
    <button class="metal" data-metal="yg" aria-pressed="false"><span class="sw yg"></span>Yellow Gold</button>
    <button class="metal" data-metal="pt" aria-pressed="false"><span class="sw pt"></span>Platinum</button>
  </div>
  <div class="hint"><span>Drag to rotate · Scroll or pinch to zoom</span><button id="reset">Reset view</button></div>
</footer>

<div id="loader"><div class="bar"><i id="prog"></i></div><span>Loading</span></div>
<div id="err">This 3D viewer needs WebGL, which isn't available in this browser.</div>

<script type="module">
import * as THREE from './three-bundle.js';
const { OrbitControls, GLTFLoader, MeshoptDecoder } = THREE;

const METALS = {
  ag:   { name: 'Sterling silver 925', color: [0.96, 0.95, 0.92], rough: 0.03 },
  wg:   { name: '14K White Gold',  color: [0.88, 0.89, 0.91], rough: 0.025 },
  yg:   { name: '14K Yellow Gold', color: [1.0, 0.70, 0.26], rough: 0.03 },
  wg18: { name: '18K White Gold',  color: [0.88, 0.89, 0.91], rough: 0.025 },
  yg18: { name: '18K Yellow Gold', color: [1.0, 0.62, 0.17], rough: 0.03 },
  pt:   { name: 'Platinum 950',    color: [0.70, 0.685, 0.66], rough: 0.035 },
};
const PIECES = {
  'tama':               { file: 'tama.glb',               title: 'Mizuhiki Tama Pendant', floor: false, dir: [0.25, 0.18, 1.0] },
  'ring':               { file: 'ring.glb',               title: 'Ume Musubi Ring',      floor: true,  dir: [0.42, 0.55, 0.88] },
  'pendant':            { file: 'pendant.glb',            title: 'Ume Musubi Pendant',   floor: false, dir: [0.18, 0.12, 1.0] },
  'ume-bracelet':       { file: 'ume-bracelet.glb',       title: 'Ume Musubi Bracelet',  floor: false, dir: [0.18, 0.12, 1.0] },
  'awaji-ring':         { file: 'awaji-ring.glb',         title: 'Awaji Musubi Ring',    floor: true,  dir: [0.5, 0.75, 0.6] },
  'shimenawa-pendant':  { file: 'shimenawa-pendant.glb',  title: 'Shimenawa Pendant',    floor: false, dir: [0.18, 0.12, 1.0] },
  'shimenawa-bracelet': { file: 'shimenawa-bracelet.glb', title: 'Shimenawa Bracelet',   floor: false, dir: [0.18, 0.12, 1.0] },
  'shimenawa-earrings': { file: 'shimenawa-earrings.glb', title: 'Shimenawa Earrings',   floor: false, dir: [0.12, 0.1, 1.0] },
};

const stage = document.getElementById('stage');
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, powerPreference: 'high-performance' });
} catch (e) {
  document.getElementById('err').style.display = 'flex';
  document.getElementById('loader').classList.add('hide');
  throw e;
}
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setClearColor(0xffffff, 1);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.NeutralToneMapping;
renderer.toneMappingExposure = 1.15;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.VSMShadowMap;
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xffffff);

// ---------- Studio environment for jewellery reflections ----------
function buildStudioEnv() {
  // Jewellery light-tent: mostly bright surroundings, crisp HDR strips for sparkle,
  // and a few thin dark bands so polished edges stay defined.
  const env = new THREE.Scene();
  const dome = new THREE.SphereGeometry(10, 96, 48);
  const cols = [];
  const p = dome.attributes.position;
  const lo = new THREE.Color(0.16, 0.16, 0.17), mid = new THREE.Color(0.48, 0.48, 0.49), hi = new THREE.Color(0.42, 0.42, 0.43);
  const c = new THREE.Color();
  for (let i = 0; i < p.count; i++) {
    const y = p.getY(i) / 10;
    if (y < 0) c.copy(lo).lerp(mid, THREE.MathUtils.smoothstep(y, -0.7, 0.0));
    else c.copy(mid).lerp(hi, THREE.MathUtils.smoothstep(y, 0.0, 0.6));
    cols.push(c.r, c.g, c.b);
  }
  dome.setAttribute('color', new THREE.Float32BufferAttribute(cols, 3));
  env.add(new THREE.Mesh(dome, new THREE.MeshBasicMaterial({ vertexColors: true, side: THREE.BackSide })));
  const panel = (dir, w, h, k, roll = 0) => {
    const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ color: new THREE.Color(k, k, k), side: THREE.DoubleSide }));
    m.position.set(...dir).normalize().multiplyScalar(7);
    m.lookAt(0, 0, 0); m.rotateZ(roll);
    env.add(m);
  };
  // big soft sources
  panel([0.15, 1.0, 0.35], 2.4, 2.0, 4.0);
  panel([0.35, 0.92, -0.2], 0.4, 5.0, 10, 0.5);   // overhead strip
  panel([-0.35, 0.92, 0.2], 0.4, 5.0, 10, -0.4);  // overhead strip          // overhead
  panel([-0.6, 0.55, 0.6], 4.5, 2.6, 6.0);     // key
  panel([0.75, 0.4, 0.5], 4.0, 3.0, 3.5);      // fill
  panel([0.0, 0.25, 1.0], 6.0, 3.0, 3.0);      // front
  // crisp strips around the horizon -> sharp highlight lines on the band and knot
  for (let i = 0; i < 10; i++) {
    const a = (i / 10) * Math.PI * 2 + 0.2;
    panel([Math.cos(a), 0.12 + 0.18 * (i % 2), Math.sin(a)], 0.35, 5.5, 14);
  }
  // thin dark bands for contrast
  for (let i = 0; i < 6; i++) {
    const a = (i / 6) * Math.PI * 2 + 0.75;
    panel([Math.cos(a), -0.05, Math.sin(a)], 0.9, 4.5, 0.0);
  }
  panel([0, -1, 0], 6, 6, 0.08);               // dark floor patch directly below
  return env;
}
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(buildStudioEnv(), 0.004).texture;
scene.environmentIntensity = 1.0;

// ---------- Soft floor shadow ----------
const shadowLight = new THREE.DirectionalLight(0xffffff, 0.0001);
shadowLight.castShadow = true;
shadowLight.shadow.mapSize.set(1024, 1024);
shadowLight.shadow.radius = 9;
shadowLight.shadow.blurSamples = 20;
shadowLight.shadow.bias = -0.0005;
const sc = shadowLight.shadow.camera;
sc.left = sc.bottom = -0.04; sc.right = sc.top = 0.04; sc.near = 0.001; sc.far = 0.3;
scene.add(shadowLight, shadowLight.target);
const floor = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), new THREE.ShadowMaterial({ opacity: 0.06 }));
floor.rotation.x = -Math.PI / 2;
floor.receiveShadow = true;
scene.add(floor);

// ---------- Camera & controls ----------
const camera = new THREE.PerspectiveCamera(28, 1, 0.001, 10);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.enablePan = false;
controls.rotateSpeed = 0.7;
controls.autoRotate = true;
controls.autoRotateSpeed = 1.2;
let idleTimer;
controls.addEventListener('start', () => { controls.autoRotate = false; clearTimeout(idleTimer); });
controls.addEventListener('end', () => { idleTimer = setTimeout(() => (controls.autoRotate = true), 6000); });

// ---------- Material ----------
const material = new THREE.MeshPhysicalMaterial({ metalness: 1, roughness: 0.06, envMapIntensity: 1 });
const targetColor = new THREE.Color();
let currentMetal = 'wg';
function setMetal(key, instant) {
  currentMetal = key;
  const m = METALS[key];
  targetColor.setRGB(...m.color); // linear working space
  material.roughness = m.rough;
  if (instant) material.color.copy(targetColor);
  document.getElementById('subtitle').textContent = m.name;
  document.querySelectorAll('.metal').forEach(b => b.setAttribute('aria-pressed', b.dataset.metal === key));
}

// ---------- Loading ----------
const loader = new GLTFLoader().setMeshoptDecoder(MeshoptDecoder);
const cache = {};
let current = null, currentKey = null, view = null;
const progEl = document.getElementById('prog');

function load(key) {
  if (cache[key]) return Promise.resolve(cache[key]);
  const file = PIECES[key].file;
  const onGltf = (res) => g => {
    const root = g.scene;
    root.traverse(o => { if (o.isMesh) { o.material = material; o.castShadow = true; } });
    const box = new THREE.Box3().setFromObject(root);
    const size = box.getSize(new THREE.Vector3());
    const center = box.getCenter(new THREE.Vector3());
    root.position.sub(center);
    cache[key] = { root, size, minY: box.min.y - center.y };
    res(cache[key]);
  };
  if (file.endsWith('.json')) {
    // packaged as base64 JSON (for hosts that don't serve .glb)
    return fetch(file).then(r => r.json()).then(d => {
      const bin = atob(d.glb); const u = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
      return new Promise((res, rej) => loader.parse(u.buffer, '', onGltf(res), rej));
    });
  }
  return new Promise((res, rej) => loader.load(file, onGltf(res),
    e => { if (e.total) progEl.style.width = (100 * e.loaded / e.total) + '%'; }, rej));
}

function frame(entry, key) {
  const r = entry.size.length() / 2;
  const fov = THREE.MathUtils.degToRad(camera.fov);
  const dist = (r / Math.sin(fov / 2)) * (camera.aspect < 1 ? 1.35 / Math.max(camera.aspect, 0.55) : 1.2);
  const dir = new THREE.Vector3(...PIECES[key].dir).normalize();
  const target = new THREE.Vector3(0, PIECES[key].floor ? 0 : 0, 0);
  view = { pos: dir.multiplyScalar(dist).add(target), target };
  controls.minDistance = dist * 0.45;
  controls.maxDistance = dist * 2.2;
  controls.maxPolarAngle = PIECES[key].floor ? THREE.MathUtils.degToRad(86) : Math.PI;
  resetView();
}
function resetView() {
  if (!view) return;
  camera.position.copy(view.pos);
  controls.target.copy(view.target);
  controls.update();
}

async function showPiece(key) {
  if (key === currentKey) return;
  document.querySelectorAll('.pieces button').forEach(b => b.setAttribute('aria-pressed', b.dataset.piece === key));
  document.getElementById('title').textContent = PIECES[key].title;
  const entry = await load(key);
  if (current) scene.remove(current);
  current = entry.root; currentKey = key;
  scene.add(current);
  floor.visible = PIECES[key].floor;
  floor.position.y = entry.minY - 0.00005;
  shadowLight.position.set(0.0, 0.15, 0.004);
  shadowLight.target.position.set(0, entry.minY, 0);
  frame(entry, key);
}

// ---------- UI ----------
document.querySelectorAll('.pieces button').forEach(b => b.addEventListener('click', () => showPiece(b.dataset.piece)));
document.querySelectorAll('.metal').forEach(b => b.addEventListener('click', () => setMetal(b.dataset.metal)));
document.getElementById('reset').addEventListener('click', resetView);

function resize() {
  const w = stage.clientWidth, h = stage.clientHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);

renderer.setAnimationLoop(() => {
  material.color.lerp(targetColor, 0.12);
  controls.update();
  renderer.render(scene, camera);
});

// ---------- Options: ?piece=ring|pendant &metal=wg|yg|pt &ui=full|metals|none &rotate=0 ----------
const q = new URLSearchParams(location.search.length > 1 ? location.search : location.hash.slice(1));
const startPiece = PIECES[q.get('piece')] ? q.get('piece') : 'ring';
const startMetal = METALS[q.get('metal')] ? q.get('metal') : 'wg';
const ui = q.get('ui') || 'full';
if (ui !== 'full') { document.querySelector('header').style.display = 'none'; }
if (ui === 'none') { document.querySelector('.metals').style.display = 'none'; }
if (q.get('rotate') === '0') controls.autoRotate = false;
// Let the shop page drive the viewer: iframe.contentWindow.postMessage({ matane: true, metal: 'yg', piece: 'ring' }, '*')
window.addEventListener('message', e => {
  const d = e.data; if (!d || d.matane !== true) return;
  if (d.metal && METALS[d.metal]) setMetal(d.metal);
  if (d.piece && PIECES[d.piece]) showPiece(d.piece);
});

setMetal(startMetal, true);
resize();
showPiece(startPiece).then(() => {
  document.getElementById('loader').classList.add('hide');
  Object.keys(PIECES).forEach(k => k !== startPiece && load(k)); // preload others
}).catch(() => {
  document.querySelector('#loader span').textContent = 'Could not load the 3D model';
});
</script>
</body>
